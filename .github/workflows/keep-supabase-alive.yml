name: Keep Supabase Active (Anti-Pause)

on:
  schedule:
    # Berjalan setiap hari pada pukul 01:00 UTC (08:00 WIB)
    # Memastikan database Supabase Free Tier selalu memiliki aktivitas nyata dan tidak pernah di-pause
    - cron: '0 1 * * *'
  workflow_dispatch: # Memungkinkan tombol manual "Run workflow" di tab Actions GitHub

jobs:
  keep-alive:
    name: Keep Alive Ping (App & Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Vercel App Health & Trigger Database Query
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          TARGET_URL="${APP_URL:-https://dlilearn.vercel.app}"
          CLEAN_URL="${TARGET_URL%/}"
          if [[ ! "$CLEAN_URL" =~ ^https?:// ]]; then
            CLEAN_URL="https://$CLEAN_URL"
          fi

          echo "📡 [1/2] Mem-ping endpoint health Vercel di: $CLEAN_URL/health ..."
          HTTP_CODE=$(curl -s -L -o resp_health.json -w "%{http_code}" "$CLEAN_URL/health")
          echo "Status Code (/health): $HTTP_CODE"
          echo "Response Body: $(cat resp_health.json)"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Query database Supabase melalui Laravel Vercel BERHASIL dijalankan!"
          else
            echo "⚠️ Mencoba endpoint alternatif: $CLEAN_URL/api/health ..."
            ALT_CODE=$(curl -s -L -o resp_alt.json -w "%{http_code}" "$CLEAN_URL/api/health")
            echo "Status Code (/api/health): $ALT_CODE"
            echo "Response Body: $(cat resp_alt.json)"
          fi

      - name: Direct Ping Supabase REST Database Query (Optional)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            API_KEY="${SUPABASE_SERVICE_ROLE:-$SUPABASE_ANON_KEY}"
            CLEAN_SUPABASE_URL="${SUPABASE_URL%/}"

            if [ -n "$API_KEY" ]; then
              echo "📡 [2/2] Mem-ping Supabase REST API Query ($CLEAN_SUPABASE_URL/rest/v1/users?select=id&limit=1)..."
              REST_STATUS=$(curl -s -L -o rest_resp.json -w "%{http_code}" -X GET \
                "$CLEAN_SUPABASE_URL/rest/v1/users?select=id&limit=1" \
                -H "apikey: $API_KEY" \
                -H "Authorization: Bearer $API_KEY")

              echo "REST HTTP Status: $REST_STATUS"
              echo "REST Response: $(cat rest_resp.json)"
            fi
          fi
          echo "🎉 Selesai! Supabase tetap aktif dan terhindar dari auto-pause."
